name: DKSC Stage +2A read-only tests

on:
  pull_request:
    branches: [main]
    paths:
      - tools/**
      - tests/**
      - docs/**
      - .github/workflows/stage-plus2-tests.yml

# 検証用fixtureのみ実行します。入力受付・公開・artifact uploadは行いません。
permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout development PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Offline real-Git verifier tests
        run: python -m unittest discover -s tests -p 'test_stage2.py' -v
      - name: Stage +1 regression
        run: node --test tests/test_stage1.mjs
